# Production-ish stack for the home server. Expose lofu to your tailnet with:
#   tailscale serve --bg --https=443 http://127.0.0.1:8787
name: lofu

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787" # loopback only; Tailscale Serve provides HTTPS + tailnet access
    environment:
      LOFU_HOST: 0.0.0.0
      LOFU_PORT: 8787
      LOFU_DATA_DIR: /data
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in docker/.env}
    # Runs as uid 1000 (the image's `bun` user). Create the host dirs first
    # (`bun run stack:up` does) or Docker creates them root-owned.
    volumes:
      - ${LOFU_DATA:-../data}/server:/data
    depends_on:
      meilisearch:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.56
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700" # for local dev and debugging only
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in docker/.env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${LOFU_DATA:-../data}/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
