# The lofu stack. Two ways to run it:
#
#   bun run stack:up      development: builds the image from this checkout
#                         (docker/compose.sh adds compose.override.yaml if present)
#   docker/prod.sh deploy production: pulls the image CI built for a commit and
#                         runs it from its own directory and data (README.md)
#
# Expose production to your tailnet with:
#   tailscale serve --bg --https=443 http://127.0.0.1:<LOFU_HTTP_PORT>
name: lofu

services:
  server:
    # Development builds this as lofu-server:local; production sets LOFU_IMAGE
    # and LOFU_TAG to the image CI pushed (ghcr.io/jcdiv47/lofu-server:<sha>).
    image: ${LOFU_IMAGE:-lofu-server}:${LOFU_TAG:-local}
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
      args:
        LOFU_COMMIT: ${LOFU_COMMIT:-dev}
    restart: unless-stopped
    ports:
      # Loopback only; Tailscale Serve provides HTTPS + tailnet access.
      - "127.0.0.1:${LOFU_HTTP_PORT:-8787}:8787"
    environment:
      LOFU_HOST: 0.0.0.0
      LOFU_PORT: 8787
      LOFU_DATA_DIR: /data
      LOFU_BROWSER: http://browser:9222
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in docker/.env}
    # The slim image has no curl; Bun's fetch does the probe.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # SIGTERM stops the HTTP server, then lets running jobs and the indexer
    # finish (main.ts). Docker's default 10s can cut that short.
    stop_grace_period: 30s
    # Runs as uid 1000 (the image's `bun` user). Create the host dirs first
    # (`bun run stack:up` does) or Docker creates them root-owned.
    volumes:
      - ${LOFU_DATA:-../data}/server:/data
    networks: [default, browser]
    depends_on:
      meilisearch:
        condition: service_healthy
      browser:
        condition: service_started

  meilisearch:
    # Patch updates only (.github/dependabot.yml): a new minor version can't
    # open an older index. The index is derived, so to upgrade, bump this,
    # delete <data>/meili and run `admin.ts reindex`.
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEILI_HTTP_PORT:-7700}:7700" # for local dev and debugging only
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in docker/.env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${LOFU_DATA:-../data}/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Headless Chromium for JavaScript-only pages and bot walls. It runs the
  # scripts of pages you save, so it gets its own container: no data, no
  # secrets, no published port, and a network shared with the server alone
  # (it can't reach Meilisearch). Chromium's own sandbox needs privileges a
  # container lacks; this container is the boundary instead. The server
  # refuses its requests to private addresses (netguard.ts).
  browser:
    # A browser running untrusted pages needs its updates. Pinned so a deploy
    # is reproducible; Dependabot proposes each new release weekly.
    image: chromedp/headless-shell:159.0.8154.6@sha256:0a09ac93fbc9e0849dc2bc178fc29e0a9c1ff0b79ca64c03b46dbc0757b3c3ac
    restart: unless-stopped
    user: "65534:65534"
    environment:
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
    networks: [browser]

networks:
  default:
  browser:
