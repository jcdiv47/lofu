# Tailscale sidecar. Gives lofu its own tailnet node,
# https://<TS_HOSTNAME>.<tailnet>.ts.net, with a real certificate (which iOS
# App Transport Security requires). docker/prod.sh adds this file when
# TS_HOSTNAME is set in its .env.
#
# Runs in host network mode with userspace networking (TS_USERSPACE=true) on
# its own WireGuard UDP port (TS_WG_PORT, default 41644) so it can use router
# UPnP/NAT-PMP/PCP and host IPv6 for direct connections without colliding with
# a host tailscaled (41641). The server stays in its own Docker networks and
# publishes only on host loopback (127.0.0.1:${LOFU_HTTP_PORT:-8787}), which
# Tailscale Serve proxies over HTTPS.

configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
       "Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:${LOFU_HTTP_PORT:-8787}"}}}},
       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    network_mode: host
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME}
      # Only needed for the first login; the node's identity is in the state dir.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_TAILSCALED_EXTRA_ARGS: "--port=${TS_WG_PORT:-41644}"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:${TS_HEALTH_PORT:-41235}
      TS_ACCEPT_DNS: "false"
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ${LOFU_DATA:?set LOFU_DATA}/tailscale:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${TS_HEALTH_PORT:-41235}/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  server:
    depends_on:
      tailscale:
        condition: service_healthy
