[package]
name = "lofu-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line client for lofu, designed for humans and agents"

[[bin]]
name = "lofu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
