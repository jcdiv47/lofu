# Pinned images and actions, and a PR when they have updates. Merging one to
# main builds a new server image; `docker/prod.sh deploy` ships it.
version: 2
updates:
  # Meilisearch and the headless browser in docker/compose.yaml. The browser
  # runs the scripts of pages you save, so take its updates promptly.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # A minor Meilisearch release can't open the previous one's index; that
      # upgrade is done by hand (see the comment in compose.yaml).
      - dependency-name: getmeili/meilisearch
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The Bun base image in docker/server.Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  # npm packages in the Bun workspace (bun.lock at the root covers server,
  # extension and packages/*). Minor and patch updates come as one PR;
  # majors come one per package. Defuddle is 0.x, so its minor releases can
  # change extraction output: check extract/markdown.ts before merging.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        update-types: ["minor", "patch"]
        exclude-patterns: ["defuddle"]
  # The Rust CLI (crates/*).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
