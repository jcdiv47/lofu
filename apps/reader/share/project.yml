# The share extension, built by `package.ts` (xcodegen, then xcodebuild) and
# put into nsh's lofu.app. Build settings that vary (team, versions, the
# Keychain group) come from package.ts on xcodebuild's command line.
name: LofuShare
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  LofuShare:
    type: app-extension
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: LofuShare
        PRODUCT_BUNDLE_IDENTIFIER: app.lofu.reader.share
        # The project is generated into .nsh/share, so these come from package.ts.
        INFOPLIST_FILE: $(LOFU_SHARE)/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(LOFU_SHARE)/LofuShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
