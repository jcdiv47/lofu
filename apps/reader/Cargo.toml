[package]
name = "lofu-reader-native"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the repository's workspace: nsh builds it into the app's
# runners (`nsh.json` "rust"), for each target the app is built for.
[workspace]

[dependencies]
nsh-core = "0.4.0"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSArray",
  "NSBundle",
  "NSEnumerator",
  "NSGeometry",
  "NSSet",
  "NSString",
  "NSURL",
] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.4.0", default-features = false }
security-framework = { version = "3.7", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "UIResponder",
  "UIView",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
] }
